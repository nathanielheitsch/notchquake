name: gate

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  gate:
    runs-on: macos-latest
    # apt-none: this app is macOS-arm64 only, so there is no distro packaging or
    # apt-get step — the Rust toolchain ships with the macos-latest image.
    steps:
      - uses: actions/checkout@1
      # fail-fast: any failing step stops the job (no continue-on-error).
      - run: cargo fmt --all --check
      - run: cargo build
      - run: cargo test
