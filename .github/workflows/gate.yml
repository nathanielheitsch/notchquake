name: gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all --check
      - run: cargo build --locked
      - run: cargo test --locked
      # Offline + deterministic; needs only Cargo.lock, the registry sources `cargo build`
      # just fetched, and the committed licenses/ texts. cargo-deny is not on the runner, so
      # the `deny` check stays a local/release step (scripts/gen-notices.sh deny).
      - run: scripts/gen-notices.sh check
