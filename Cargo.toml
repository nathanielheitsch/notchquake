[package]
name = "notchquake"
version = "0.1.0"
edition = "2024"

[dependencies]
alacritty_terminal = "0.26.0"
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-core-data = "0.3.2"
objc2-core-foundation = { version = "0.3.2", features = ["CFArray"] }
objc2-core-graphics = "0.3.2"
objc2-core-text = "0.3.2"
objc2-foundation = "0.3.2"
block2 = "0.6.2"
libc = "0.2.190"
# `polling` is NOT re-exported by alacritty_terminal, but our PTY tee must
# name `polling::{Event, PollMode, Poller}` to implement `EventedReadWrite`.
# It is already compiled transitively (alacritty depends on polling 3.8), so
# declaring it here unifies to the same 3.11.0 in Cargo.lock with no new code.
polling = "3.11"
